name: Master CI
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - name: Verify dist is up to date
      run: |
        npm run prepare
        git diff --exit-code -- dist/ || (echo "::error::dist/ is out of date, run 'npm run prepare' and commit the result" && exit 1)

  bump-version:
    name: Tag New Release Version
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: bump
        name: Bump and Tag New Release Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: true
          release-notes-prefix: '### RELEASE NOTES'
          with-v: true

      # Keep a floating major tag (e.g. v2) pointing at the newest release so
      # consumers can use `@v2`. Only moves when a real version was tagged.
      - name: Move Floating Major Version Tag
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::not moving major tag for non-release version '$VERSION'"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "::notice::moved $major to $VERSION ($GITHUB_SHA)"
