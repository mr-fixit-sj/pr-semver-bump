name: Master CI
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - name: Verify dist is up to date
      run: |
        npm run prepare
        git diff --exit-code -- dist/ || (echo "::error::dist/ is out of date, run 'npm run prepare' and commit the result" && exit 1)

  bump-version:
    name: Tag New Release Version
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        name: Bump and Tag New Release Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: true
          release-notes-prefix: '### RELEASE NOTES'
          with-v: true
