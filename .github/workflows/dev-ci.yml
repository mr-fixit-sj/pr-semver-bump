name: Dev CI
on:
  push:
    branches-ignore:
      - master

jobs:
  test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - name: Verify dist is up to date
      run: |
        npm run prepare
        git diff --exit-code -- dist/ || (echo "::error::dist/ is out of date, run 'npm run prepare' and commit the result" && exit 1)
